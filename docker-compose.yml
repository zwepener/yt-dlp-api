services:
  api:
    build: .
    image: yt-dlp-api
    container_name: yt-dlp-api
    environment:
      REDIS_ADDR: "redis:6379"
    env_file: .env
    ports:
      - "${SERVER_PORT}:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:${SERVER_PORT}/heartbeat" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      restart_policy:
        condition: unless-stopped
        delay: 5s
        window: 120s
